version: '3.8'
services:
  # Update this to the name of the service you want to work with in your docker-compose.yml file
  api:
    build:
      context: ..
      dockerfile: ./.devcontainer/Dockerfile

    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - ..:/JSTC

    # Uncomment the next four lines if you will use a ptrace-based debugger like C++, Go, and Rust.
    # cap_add:
    #   - SYS_PTRACE
    # security_opt:
    #   - seccomp:unconfined

    # Run an init (tini) as PID 1 so orphaned subprocesses get reaped. Without
    # this, PID 1 is the bare `sleep infinity` below, which never calls wait():
    # every browser subprocess orphaned by an interrupted e2e run then lingers
    # as an unreapable zombie for the life of the container.
    init: true

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
 
